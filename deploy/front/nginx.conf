# 前端站点（nginx）—— 托管静态产物 + 反代后端接口
#
# 本文件挂到容器的 /etc/nginx/conf.d/default.conf。
# nginx:alpine 自带的主 nginx.conf 已包含 http{} 与 `include conf.d/*.conf`，
# 访问日志也已指向 stdout —— 所以 `docker compose logs -f comic-web` 能直接看到访问日志。
#
# ⚠️ 本文件在 deploy/web/ 与 deploy/front/ 各有一份、内容**完全相同**。
#    原因：Docker 的构建上下文只能是自己的模块文件夹（跨目录 COPY 做不到），
#    所以同一份配置只能各存一份。deploy/build.sh 会在构建前**校验两份逐字节一致** ——
#    只改一份会当场报错，不会静默跑偏。
#
# 分流规则：/api/* 与 FastAPI 自带的接口文档走后端 comic-app:8000，其余全是本站静态文件。

upstream comic_app {
    server comic-app:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;              # 有域名就换成 comic.example.com（HTTP 阶段填不填都能访问）

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 8m;    # 目前没有上传接口，留点余量
    charset utf-8;

    # ---- 后端：接口 + 接口文档 ----
    # 用一条正则一次性覆盖 /api/* 与 FastAPI 自带的 /docs、/redoc、/openapi.json，
    # 免得把同一段 proxy 配置抄四遍。proxy_pass 不带 URI，路径原样透传。
    location ~ ^/(api/|docs|redoc|openapi\.json) {
        proxy_pass http://comic_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # 图片穿透取图、封面回源等可能较慢；默认 60s 容易误判超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- 静态资源 ----
    # 产物是内容哈希文件名（assets/index-<hash>.js）：内容一变文件名就变，可以长期强缓存。
    # 用 add_header 而不是 expires —— 两者同时写会产生两个 Cache-Control 头。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 首页不缓存：否则发了新版前端还会看到旧页面
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # 其余：图标 / static 目录 / 任何前端路由。
    # 两个前端都是 **hash 路由**（`#/...` 不出现在 HTTP 请求里），服务端正常只会收到
    # `/`、`/assets/*`、`/static/*`；末尾的 index.html 兜底纯属容错。
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ================================================================
# HTTPS（有证书后启用）
#
# 1) 拿证书（certbot 示例，证书目录挂到容器 /etc/nginx/certs）：
#      certbot certonly --standalone -d comic.example.com
#      # 产物：/etc/letsencrypt/live/comic.example.com/{fullchain.pem,privkey.pem}
#    并在 docker-compose.yml 对应的前端服务里加上：
#      volumes:
#        - /etc/letsencrypt:/etc/nginx/certs:ro
#      ports:
#        - "443:443"
#
# 2) 把上面 80 那个 server 的 `listen 80;` 改为下面这段「跳转到 https」，
#    再把上面所有 location 段整体复制进 443 的 server（nginx 不能跨 server 复用 location）。
#
# server {
#     listen 80;
#     server_name comic.example.com;
#     return 301 https://$host$request_uri;
# }
#
# server {
#     listen 443 ssl;
#     http2 on;
#     server_name comic.example.com;
#
#     root /usr/share/nginx/html;
#     index index.html;
#
#     ssl_certificate     /etc/nginx/certs/live/comic.example.com/fullchain.pem;
#     ssl_certificate_key /etc/nginx/certs/live/comic.example.com/privkey.pem;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_session_cache   shared:SSL:10m;
#
#     add_header Strict-Transport-Security "max-age=31536000" always;
#
#     # ...（在此粘贴上面 80 端口 server 里的 location 段）...
# }
# ================================================================
