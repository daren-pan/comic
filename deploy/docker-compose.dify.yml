    - ./dify/nginx/nginx.conf.template:/etc/nginx/nginx.conf.template
    - ./dify/nginx/proxy.conf.template:/etc/nginx/proxy.conf.template
    - ./dify/nginx/https.conf.template:/etc/nginx/https.conf.template
    - ./dify/nginx/conf.d:/etc/nginx/conf.d
    - ./dify/nginx/docker-entrypoint.sh:/docker-entrypoint-mount.sh
    - ./dify/nginx/ssl:/etc/ssl
    - ${DIFY_VOLUMES:-../../dify/docker/volumes}/certbot/conf/live:/etc/letsencrypt/live
    - ${DIFY_VOLUMES:-../../dify/docker/volumes}/certbot/conf:/etc/letsencrypt
    - ${DIFY_VOLUMES:-../../dify/docker/volumes}/certbot/www:/var/www/html
    entrypoint:
    - sh
    - -c
    - "cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && sed -i 's/\r$$//' /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh"
    environment:
      NGINX_SSL_PORT: ${NGINX_SSL_PORT:-443}
      NGINX_PORT: ${NGINX_PORT:-80}
    depends_on:
    - api
    - web
    ports:
    - ${EXPOSE_NGINX_PORT:-80}:${NGINX_PORT:-80}
    - ${EXPOSE_NGINX_SSL_PORT:-443}:${NGINX_SSL_PORT:-443}
    container_name: docker-nginx-1
networks:
  ssrf_proxy_network:
    driver: bridge
    internal: true
  local_sandbox_proxy_network:
    driver: bridge
    internal: true
  agent_sandbox_network:
    driver: bridge
    internal: true
volumes:
  dify_agent_local_sandbox_home:
    external: true
    name: docker_dify_agent_local_sandbox_home
  dify_agent_local_sandbox_workspace:
    external: true
    name: docker_dify_agent_local_sandbox_workspace
