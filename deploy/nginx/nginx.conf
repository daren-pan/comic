# 反向代理（nginx）
#
# ⚠️ 本文件是**站点配置**，挂到容器的 /etc/nginx/conf.d/default.conf
#    （nginx:alpine 自带的主 nginx.conf 已经包含 http{} 与 `include conf.d/*.conf`，
#      访问日志也已指向 stdout —— 所以 `docker compose logs -f nginx` 能直接看）
#
# 默认只开 **80**：适合内网 / 先用 IP 或域名试用。要 HTTPS 见文件末尾的注释段。

upstream comic_app {
    server comic-app:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;              # 有了域名就换成 comic.example.com（HTTP 阶段填不填都能访问）

    client_max_body_size 8m;    # 目前没有上传接口，留点余量
    charset utf-8;

    # 前端产物是内容哈希文件名（assets/index-<hash>.js），可以长期强缓存。
    # 用 add_header 而不是 expires —— 两者同时写会产生两个 Cache-Control 头。
    location /assets/ {
        proxy_pass http://comic_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 首页与 index.html 不缓存：否则发了新版前端还会看到旧页面
    location = /index.html {
        proxy_pass http://comic_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        add_header Cache-Control "no-cache" always;
    }

    # 其余（页面 / API / 图片 / docs）统一交给后端：
    # 图片端点优先返回已转存的真实文件，缺失时回退生成 SVG 占位图，不会裂图。
    location / {
        proxy_pass http://comic_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # 图片穿透取图、封面回源等可能较慢；默认 60s 容易误判超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 说明：/api/admin/* 目前**不做任何限制**（管理台无鉴权），这是已知项、后续会处理。
    # 现阶段仅用于测试上线，不要把本服务直接挂到公网长期暴露。
}

# ================================================================
# HTTPS（有证书后启用）
#
# 1) 拿证书（certbot 示例，证书目录挂到容器 /etc/nginx/certs）：
#      certbot certonly --standalone -d comic.example.com
#      # 产物：/etc/letsencrypt/live/comic.example.com/{fullchain.pem,privkey.pem}
#    并在 docker-compose.yml 的 nginx 服务里加上：
#      volumes:
#        - /etc/letsencrypt:/etc/nginx/certs:ro
#      ports:
#        - "443:443"
#
# 2) 把上面 80 那个 server 的 `listen 80;` 改为下面这段「跳转到 https」，
#    再把上面所有 location 段整体复制进 443 的 server（nginx 不能跨 server 复用 location）。
#
# server {
#     listen 80;
#     server_name comic.example.com;
#     return 301 https://$host$request_uri;
# }
#
# server {
#     listen 443 ssl;
#     http2 on;
#     server_name comic.example.com;
#
#     ssl_certificate     /etc/nginx/certs/live/comic.example.com/fullchain.pem;
#     ssl_certificate_key /etc/nginx/certs/live/comic.example.com/privkey.pem;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_session_cache   shared:SSL:10m;
#
#     add_header Strict-Transport-Security "max-age=31536000" always;
#
#     # ...（在此粘贴上面 80 端口 server 里的 location 段）...
# }
# ================================================================
