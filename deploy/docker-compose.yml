# 漫画聚合平台 —— 生产编排（Linux）
#
# 目录结构（每个模块一个文件夹，产物与 Dockerfile 放在一起）：
#   deploy/web/      网页端产物 dist/          -> comic-web:1.0.0     （自带 nginx，宿主 85）
#   deploy/front/    移动端产物 dist/          -> comic-front:1.0.0   （自带 nginx，宿主 86）
#   deploy/crawler/  采集层 wheel              -> comic-crawler:1.0.0（可单独当 CLI 镜像用）
#   deploy/api/      接口层 wheel（依赖采集层 wheel）-> comic-api:1.0.0（**纯 API**，不含前端）
#   deploy/mysql/    自带数据库 Dockerfile      -> comic-mysql:1.0.0 （本项目独占的库）
#
# 前端两个入口**各自带 nginx**（不再有独立的反代容器）：静态产物 + 反代在同一个容器里，
# 所以「只开移动端」时不会出现「反代活着但产物不在」的悬空状态，按需启动最省事。
#
# 快速开始：
#   cp deploy/.env.example deploy/.env     # 然后编辑：MYSQL_ROOT_PASSWORD + COMIC_JWT_SECRET
#   ./deploy/up.sh                         # 一键：前端 build + 镜像 build + 起服务 + 自检（两个入口都起）
#   （或分步：cd comic-web && npm run build; ./deploy/build.sh; docker compose up -d）
#
# 服务名与容器名一致、且都带 comic- 前缀（comic-mysql / comic-app / comic-web / comic-front /
# comic-scheduler），所以 `docker compose exec comic-app ...` 与 `docker exec comic-app ...`
# 指的是同一个容器；两个前端入口的宿主端口由 .env 的 WEB_PORT / FRONT_PORT 控制（默认 85 / 86）。
#
# 只开其中一个入口：把服务名写在 up 后面即可（依赖链会自动带上 mysql 与 app）
#   docker compose -f deploy/docker-compose.yml up -d comic-front
#
# 常用命令：
#   docker compose -f deploy/docker-compose.yml logs -f comic-app        # 看后端日志
#   docker compose -f deploy/docker-compose.yml logs -f comic-web        # 看网页端 nginx 访问日志
#   docker compose -f deploy/docker-compose.yml ps                       # 状态
#   docker compose -f deploy/docker-compose.yml exec comic-app bash      # 进容器（跑迁移脚本等）
#   docker compose -f deploy/docker-compose.yml exec comic-web nginx -t  # 校验 nginx 配置（运行期才可解析 comic-app）
#   docker compose -f deploy/docker-compose.yml --profile collect up -d  # 额外启动定时采集
#   docker compose -f deploy/docker-compose.yml down                     # 停（卷保留，数据不丢）
name: comic

# 公共片段：app 与 scheduler 用同一镜像、同一份数据卷与数据库配置
x-app-env: &app-env
  # 数据库：本项目**独占**的实例（服务名 mysql），走编排内网直连，不经过宿主端口
  COMIC_MYSQL_HOST: ${COMIC_MYSQL_HOST:-comic-mysql}
  COMIC_MYSQL_PORT: ${COMIC_MYSQL_PORT:-3306}
  COMIC_MYSQL_DB: ${COMIC_MYSQL_DB:-comic}
  COMIC_MYSQL_USER: root
  # 口令跟随上面那个库（只填一处，避免两处不一致）
  COMIC_MYSQL_PASSWORD: ${COMIC_MYSQL_PASSWORD:-${MYSQL_ROOT_PASSWORD:?deploy/.env 里必须设置 MYSQL_ROOT_PASSWORD}}
  # 必须显式提供：程序内有演示用默认值，不设就等于 token 可被伪造
  COMIC_JWT_SECRET: ${COMIC_JWT_SECRET:?deploy/.env 里必须设置 COMIC_JWT_SECRET}
  # 图库与「数据源开关」状态都放在**宿主的运行时数据目录**里（下面的 /data 就 bind 到它）。
  # 这样"本地直跑 uvicorn"与"Docker 里跑"读写的是**同一批文件** —— 不会出现两份图库互相看不见
  # （本地转存的图容器读不到、反之亦然），也不必靠"记得同步"维持一致。
  COMIC_IMAGE_ROOT: /data/image_store
  COMIC_STATE_FILE: /data/source_state.json
  # 时区：**必须显式设置** —— 基础镜像没配 TZ 时就是 UTC，而代码里所有"当前时间"都按
  # **本机时间**写入（log_record.created_at、comic/chapter.sync_time、logs/api.log 的时间戳），
  # 于是服务器上的日志时间会比北京时间早 8 小时（2026-09-18 排查「管理台日志时间对不上」）。
  # 本地直跑时本机已是本地时区，容器必须对齐到同一时区，两边看到的时间才一致。
  TZ: ${COMIC_TZ:-Asia/Shanghai}

services:
  # ---------------- 数据库（本项目独占一个实例，不与别的系统共用）----------------
  # 首次启动自动执行建库脚本（烘在镜像里）→ 10 张表直接建好，无需手工跑 SQL。
  # 数据在 mysql_data 卷里；⚠️ 改 MYSQL_ROOT_PASSWORD 只对**新卷**生效（见 .env.example）。
  comic-mysql:
    container_name: comic-mysql
    image: comic-mysql:1.0.0
    build:
      context: ./mysql
    restart: unless-stopped
    environment:
      # 默认 password：简单口令 + **靠网络层限制来源**（云安全组 / 防火墙只放行需要的来源）。
      # 要让数据库端口对公网开放的话，请换成强随机值。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${COMIC_MYSQL_DB:-comic}
      # 与 app 用**同一个时区**：MySQL 的 time_zone=SYSTEM 跟随容器时区，不设就是 UTC ——
      # `NOW()` 会比北京时间早 8 小时，而它被日志保留策略（purge 30 天）用来和
      # `log_record.created_at`（按本机时间写入）比较，两者不同会算错边界。
      TZ: ${COMIC_TZ:-Asia/Shanghai}
    # 宿主端口 3309（避开 3307 上的其它系统），仅给 Navicat/IDEA 从本机连用；
    # comic-app 走编排内网连 comic-mysql:3306，不经过这里。
    ports: ["${MYSQL_BIND:-0.0.0.0}:${MYSQL_HOST_PORT:-3309}:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      # 建库脚本已烘进镜像（deploy/mysql/sql/ → /docker-entrypoint-initdb.d/），不挂宿主文件
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [backend]

  # ---------------- 应用（**纯 API**：只提供 /api/*，不再托管前端）----------------
  comic-app:
    # 镜像由 deploy/build.sh 按顺序构建（先出产物、再建镜像）；这里同时写上 image + build，
    # 是为了"单独重建这一层"时也能用 `docker compose build comic-app`。
    # 全量重建仍建议用 deploy/build.sh（会先把两个 wheel 产物重新生成一遍）。
    image: comic-api:1.0.0
    container_name: comic-app
    build:
      context: ./api
      # 采集层的 **wheel 产物**经 BuildKit 命名上下文喂进 api 的构建（见 deploy/api/Dockerfile
      # 的 `COPY --from=crawler dist/`）—— 两个模块之间没有镜像依赖，只有 pyproject.toml 里
      # dependencies 的一句 `comic-crawler>=1.0.0`。路径按本 compose 文件所在目录解析。
      additional_contexts:
        crawler: ./crawler
    restart: unless-stopped
    # 密钥**不通过 env_file 注入**：compose 会自动读取同目录的 `deploy/.env`（已 gitignore）做
    # 变量插值，`x-app-env` 里的 `${...:?}` 守卫保证缺了就报错、不会静默用上演示默认值。
    # 用 env_file 的副作用是把 .env 里的**所有**键塞进容器 —— 包括本容器根本不需要的
    # `MYSQL_ROOT_PASSWORD` / `MYSQL_HOST_PORT` / `WEB_PORT` / `FRONT_PORT`（多一份口令副本，语义含糊）。
    environment: *app-env
    volumes:
      # 整个 /data bind 到宿主的**运行时数据目录**（默认 ../crawler-service/data，与本地直跑
      # 的默认值就是同一个目录）。服务器请在 .env 里把 COMIC_DATA_HOST 指到仓库外的独立盘
      # （如 /srv/comic/data）—— 别放仓库里，重新 clone / 重新部署会丢；且目录需可写
      # （容器内进程是 uid 10001，见 deploy/README.md「几个不显然的点」）。
      - ${COMIC_DATA_HOST:-../crawler-service/data}:/data
    depends_on:
      comic-mysql:
        condition: service_healthy
    # frontend 网络给两个前端入口的 nginx 反代用（upstream comic-app:8000 在构建期不解析、
    # 运行期才需要，所以这里必须在同一网络上）。
    networks: [backend, frontend]
    # 默认只在编排网络内暴露（经前端 nginx 访问）。想在本机直连调试再打开这行：
    # ports: ["127.0.0.1:8000:8000"]

  # ---------------- 网页端入口（comic-web 产物 + 自带 nginx）----------------
  # 只跑网页端：docker compose -f deploy/docker-compose.yml up -d comic-web
  comic-web:
    image: comic-web:1.0.0
    container_name: comic-web
    build:
      context: ./web
    restart: unless-stopped
    ports: ["${WEB_PORT:-85}:80"]
    # 站点配置与产物都烘进镜像（见 deploy/web/Dockerfile）—— 改哪样就重建这一层，可版本化/回滚。
    # 启用 HTTPS 时再加证书挂载：
    # volumes:
    #   - /etc/letsencrypt:/etc/nginx/certs:ro
    depends_on: [comic-app]
    networks: [frontend]

  # ---------------- 移动端入口（comic-front 的 H5 产物 + 自带 nginx）----------------
  # 只跑移动端：docker compose -f deploy/docker-compose.yml up -d comic-front
  # ⚠️ 与 comic-web 是**同构的两个服务**，只有产物与端口不同；两个可以同时跑，互不影响。
  comic-front:
    image: comic-front:1.0.0
    container_name: comic-front
    build:
      context: ./front
    restart: unless-stopped
    ports: ["${FRONT_PORT:-86}:80"]
    depends_on: [comic-app]
    networks: [frontend]

  # ---------------- 定时采集（可选，默认不启动）----------------
  # 用 --profile collect 才会起；不需要定时采集就永远不用它（可以在管理台手动触发）。
  # ⚠️ 注意：调度器读的是**代码里的** SOURCES[].enabled，不读管理台那个开关文件 ——
  #    在管理台关掉的源，这里仍会采集（已知差异，见 docs/deploy.md §9）。
  comic-scheduler:
    profiles: [collect]
    image: comic-crawler:1.0.0   # 直接用采集层镜像（不含 HTTP 层）
    container_name: comic-scheduler
    build:
      context: ./crawler
    restart: unless-stopped
    environment: *app-env
    volumes:
      # 与 app 是**同一个宿主目录**（转存写、接口读，必须同源）
      - ${COMIC_DATA_HOST:-../crawler-service/data}:/data
    command:
      - python
      - -m
      - comic_crawler.cli
      - serve
      - --interval
      - ${COLLECT_INTERVAL:-900}
    depends_on:
      comic-mysql:
        condition: service_healthy
    networks: [backend]

volumes:
  mysql_data:    # 本项目独占的数据库

networks:
  backend:       # comic-app / comic-scheduler ↔ comic-mysql
  frontend:      # comic-web / comic-front ↔ comic-app（两个入口 nginx 反代到后端）

# ---------------------------------------------------------------
# 数据库：本项目**独占一个 MySQL 实例**（comic-mysql 容器），不与别的系统共用。
#
#   · 起停：docker compose -f deploy/docker-compose.yml up -d     # 会一并起 mysql
#   · 首次启动自动建表：建库脚本烘在镜像里（deploy/mysql/），数据卷为空时自动执行 →
#     10 张表直接建好，不需要手工跑任何 SQL。
#   · 连法：comic-app 走编排内网 `comic-mysql:3306`；宿主端口 3309 只是给 Navicat/IDEA 从本机连用。
#   · 数据在 mysql_data 卷里，`down` 不会删卷；备份 = mysqldump + 卷快照。
#   · 图库与源开关状态**不在卷里** —— 在宿主目录（bind 到容器 /data，默认 `crawler-service/data`），
#     本地直跑与容器共用同一份。备份/迁移就针对这一个目录。
#   · ⚠️ 别和别的系统共用一个 MySQL 实例：库、账号、权限、备份策略都会互相牵连
#     （本项目曾与 RuoYi 共用 3307，出现过"别的项目建的表/库混进来"这类问题）。独立实例最省心。
#
#   库升级（加表 / 加索引）：用 tools/ 下的迁移脚本，在 app 容器里跑
#        docker compose -f deploy/docker-compose.yml exec comic-app python tools/add_log_table.py
#
#   要连宿主机上**别的** MySQL（不推荐）：覆盖 .env 里的 COMIC_MYSQL_HOST/PORT/PASSWORD 三项，
#   并给 app/scheduler 加回 extra_hosts（host.docker.internal:host-gateway）。
# ---------------------------------------------------------------
