# 采集层打包描述（相当于 Java 那边的 pom.xml）
#
# 产物：python -m pip wheel --no-deps -w dist .
#       → dist/comic_crawler-<版本>-py3-none-any.whl
# 镜像里 `pip install` 这个 whl 即可（见 deploy/crawler/Dockerfile）。
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "comic-crawler"
version = "1.0.0"
description = "漫画聚合平台 · 采集服务（源站适配 / 存储 / 调度 / 图库）"
requires-python = ">=3.10"
dependencies = [
    # 公共内核：领域模型 / 存储契约与 MySQL 实现 / 图库读写 / 标签归一。
    # pymysql、cryptography、zhconv 由它传递 —— 本包已不直接使用（存储与归一都搬过去了）。
    "comic-core>=1.0.0",
    "httpx>=0.27",
    "parsel>=1.9",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["comic_crawler*"]

# ⚠️ `data/tag_synonyms.json` 已随标签归一一起搬去公共内核（见 comic-core/pyproject.toml
#    的 package-data）—— 本包不再有需要随包分发的数据文件，故不声明 package-data。
#    各源 README.md 是文档、`fixtures/*.html` 是测试夹具，都不属于运行产物。
